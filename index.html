<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Agar.io Online Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; }
    body { overflow: hidden; background: #181c20; color: white; }
    
    /* Lobi Ekranı */
    #lobby {
      position: fixed; inset: 0; background: rgba(24, 28, 32, 0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
    }
    .panel {
      background: #252b31; padding: 30px; border-radius: 14px; width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;
    }
    .panel h1 { color: #2ed573; margin-bottom: 10px; font-size: 2rem; }
    .controls-info { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; line-height: 1.5; }
    input {
      width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
      border: 2px solid #3c444d; background: #181c20; color: white; font-size: 1rem; outline: none;
    }
    input:focus { border-color: #2ed573; }
    .oda-btn {
      width: 100%; padding: 13px 15px; margin-bottom: 10px; border: none; border-radius: 8px;
      background: #1e90ff; color: white; font-size: 1rem; font-weight: bold;
      cursor: pointer; display: flex; justify-content: space-between; transition: 0.2s;
    }
    .oda-btn:hover { background: #3742fa; transform: scale(1.02); }

    /* Skor Tablosu */
    #leaderboard {
      position: fixed; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.55);
      padding: 15px; border-radius: 8px; width: 210px; display: none; z-index: 5;
    }
    #leaderboard h3 { margin-bottom: 10px; color: #ffa502; font-size: 1rem; border-bottom: 1px solid #444; padding-bottom: 5px; text-align: center; }
    #scoreList { list-style: none; font-size: 0.9rem; }
    #scoreList li { display: flex; justify-content: space-between; margin-bottom: 6px; }

    /* Sol Alt Kütle & Bölge Göstergesi */
    #hud {
      position: fixed; bottom: 15px; left: 15px; background: rgba(0, 0, 0, 0.55);
      padding: 10px 16px; border-radius: 8px; font-size: 1rem; font-weight: bold; display: none; z-index: 5;
    }

    /* Koordinatlı A1-F6 Mini Harita */
    #minimap {
      position: fixed; bottom: 15px; right: 15px; width: 180px; height: 180px;
      background: rgba(0, 0, 0, 0.65); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px; display: none; z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Lobi -->
  <div id="lobby">
    <div class="panel">
      <h1>AGAR.IO ARENA</h1>
      <p class="controls-info">
        <b>Fare:</b> Yönlendir &nbsp;|&nbsp; <b>Boşluk (Space):</b> Bölün<br>
        <b>E veya W:</b> Yem At / Besle &nbsp;|&nbsp; <b>Yeşil Dikenler:</b> Büyükleri Patlatır!
      </p>
      <input type="text" id="playerName" placeholder="Oyuncu Adını Yaz..." maxlength="15">
      <div id="roomsContainer"></div>
    </div>
  </div>

  <!-- Sağ Üst Skor Tablosu -->
  <div id="leaderboard">
    <h3>LİDERLİK TABLOSU</h3>
    <ul id="scoreList"></ul>
  </div>

  <!-- Sol Alt Bilgi -->
  <div id="hud">Skor: <span id="myScore">0</span> | Bölge: <span id="mySector">A1</span></div>

  <!-- Sağ Alt Koordinatlı Minimap -->
  <canvas id="minimap" width="180" height="180"></canvas>

  <canvas id="gameCanvas"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    const lobby = document.getElementById('lobby');
    const roomsContainer = document.getElementById('roomsContainer');
    const leaderboard = document.getElementById('leaderboard');
    const scoreList = document.getElementById('scoreList');
    const hud = document.getElementById('hud');
    const myScoreEl = document.getElementById('myScore');
    const mySectorEl = document.getElementById('mySector');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let players = {};
    let foods = [];
    let viruses = [];
    let ejected = [];
    let inGame = false;
    const MAP_SIZE = 4000;
    const COLS = ['A', 'B', 'C', 'D', 'E', 'F'];
    const ROWS = ['1', '2', '3', '4', '5', '6'];

    // Odaları listele
    socket.on('roomList', (counts) => {
      roomsContainer.innerHTML = '';
      for (let roomName in counts) {
        const btn = document.createElement('button');
        btn.className = 'oda-btn';
        btn.innerHTML = `<span>${roomName}</span> <span>${counts[roomName]} Oyuncu</span>`;
        btn.onclick = () => joinGame(roomName);
        roomsContainer.appendChild(btn);
      }
    });

    function joinGame(roomName) {
      const name = document.getElementById('playerName').value.trim() || 'Oyuncu';
      socket.emit('joinRoom', { name, room: roomName });
      lobby.style.display = 'none';
      leaderboard.style.display = 'block';
      minimapCanvas.style.display = 'block';
      hud.style.display = 'block';
      inGame = true;
    }

    // Fare hareketi
    window.addEventListener('mousemove', (e) => {
      if (!inGame) return;
      socket.emit('mouseMove', {
        x: e.clientX - canvas.width / 2,
        y: e.clientY - canvas.height / 2
      });
    });

    // Klavye kontrolleri: Space (Bölünme), E veya W (Yem atma)
    window.addEventListener('keydown', (e) => {
      if (!inGame) return;
      if (e.code === 'Space') {
        e.preventDefault();
        socket.emit('split');
      } else if (e.code === 'KeyE' || e.code === 'KeyW') {
        socket.emit('eject');
      }
    });

    socket.on('eaten', () => {
      alert('Yem oldun! Tekrar arenaya dönebilirsin.');
      inGame = false;
      lobby.style.display = 'flex';
      leaderboard.style.display = 'none';
      minimapCanvas.style.display = 'none';
      hud.style.display = 'none';
    });

    socket.on('gameState', (state) => {
      players = state.players;
      foods = state.foods;
      viruses = state.viruses;
      ejected = state.ejected;
      updateLeaderboard();
    });

    function getPlayerTotalMass(p) {
      return p.cells.reduce((sum, c) => sum + Math.floor(c.radius), 0);
    }

    function updateLeaderboard() {
      const sorted = Object.values(players)
        .map(p => ({ name: p.name, score: getPlayerTotalMass(p) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 7);

      scoreList.innerHTML = sorted.map((p, i) => 
        `<li><span>${i + 1}. ${p.name}</span> <span>${p.score}</span></li>`
      ).join('');
    }

    // Yeşil Diken (Virüs) Çizimi
    function drawVirus(v) {
      const spikes = 24;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const r = (i % 2 === 0) ? v.radius + 6 : v.radius - 3;
        const angle = (Math.PI / spikes) * i;
        const vx = v.x + Math.cos(angle) * r;
        const vy = v.y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fillStyle = '#2ed573';
      ctx.fill();
      ctx.strokeStyle = '#1eae58';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // A1 - F6 Koordinatlı Minimap Çizimi
    function drawMinimap() {
      const w = minimapCanvas.width;
      const h = minimapCanvas.height;
      minimapCtx.clearRect(0, 0, w, h);

      const cellW = w / 6;
      const cellH = h / 6;

      // 6x6 Izgara ve A1..F6 Yazıları
      minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      minimapCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      minimapCtx.font = 'bold 10px Arial';
      minimapCtx.textAlign = 'center';
      minimapCtx.textBaseline = 'middle';

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          minimapCtx.strokeRect(c * cellW, r * cellH, cellW, cellH);
          minimapCtx.fillText(COLS[r] + ROWS[c], c * cellW + cellW / 2, r * cellH + cellH / 2);
        }
      }

      const scale = w / MAP_SIZE;

      // Oyuncuları minimapte nokta olarak çiz
      for (let id in players) {
        const p = players[id];
        p.cells.forEach(c => {
          minimapCtx.beginPath();
          minimapCtx.arc(c.x * scale, c.y * scale, Math.max(2.5, c.radius * scale), 0, Math.PI * 2);
          minimapCtx.fillStyle = (id === socket.id) ? '#2ed573' : '#ff4757';
          minimapCtx.fill();
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const me = players[socket.id];

      ctx.save();

      if (me && me.cells.length > 0) {
        // Tüm hücrelerin ortalama merkezini bul
        let avgX = 0, avgY = 0, totalRadius = 0;
        me.cells.forEach(c => {
          avgX += c.x;
          avgY += c.y;
          totalRadius += c.radius;
        });
        avgX /= me.cells.length;
        avgY /= me.cells.length;

        // Büyüdükçe kamerayı uzaklaştır (Zoom out)
        const zoom = Math.max(0.45, Math.min(1, 55 / (totalRadius * 0.7 + 25)));

        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-avgX, -avgY);

        // Sol alt HUD bilgisini güncelle
        myScoreEl.innerText = getPlayerTotalMass(me);
        const colIdx = Math.min(5, Math.max(0, Math.floor(avgX / (MAP_SIZE / 6))));
        const rowIdx = Math.min(5, Math.max(0, Math.floor(avgY / (MAP_SIZE / 6))));
        mySectorEl.innerText = COLS[rowIdx] + ROWS[colIdx];
      }

      // Harita ızgarası
      ctx.strokeStyle = '#23282e';
      ctx.lineWidth = 1;
      for (let x = 0; x <= MAP_SIZE; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y <= MAP_SIZE; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
      }

      // Harita A1-F6 Büyük Arka Plan Bölge Yazıları
      const sectorSize = MAP_SIZE / 6;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.font = 'bold 140px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          ctx.fillText(COLS[r] + ROWS[c], c * sectorSize + sectorSize / 2, r * sectorSize + sectorSize / 2);
        }
      }

      // Harita Dış Çerçevesi
      ctx.strokeStyle = '#ff4757';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // Yemler
      foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      });

      // E/W ile atılan yemler
      ejected.forEach(ej => {
        ctx.beginPath();
        ctx.arc(ej.x, ej.y, ej.radius, 0, Math.PI * 2);
        ctx.fillStyle = ej.color;
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Tüm Oyuncuların Hücreleri (Küçükten büyüğe sıralı çiz)
      let allCells = [];
      for (let id in players) {
        const p = players[id];
        p.cells.forEach(c => allCells.push({ ...c, name: p.name, color: p.color }));
      }
      allCells.sort((a, b) => a.radius - b.radius);

      allCells.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = Math.max(3, c.radius * 0.06);
        ctx.stroke();

        // İsim
        ctx.fillStyle = 'white';
        ctx.font = `bold ${Math.max(12, Math.floor(c.radius * 0.35))}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.name, c.x, c.y);
      });

      // Yeşil Dikenler (Virüsler)
      viruses.forEach(v => drawVirus(v));

      ctx.restore();

      if (inGame) drawMinimap();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
